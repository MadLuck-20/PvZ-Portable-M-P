name: Generate Android signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate permanent Android keystore
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more required repository secrets: PVZP_KEYSTORE_PASSWORD, PVZP_KEY_ALIAS, PVZP_KEY_PASSWORD."
            exit 1
          fi

      - name: Generate PKCS12 keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/pvz-release.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PvZ Portable, OU=Android, O=PvZ Portable, C=AR"

          echo "Keystore generated. Passwords and private key are not printed in the log."
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Upload keystore (download promptly and delete artifact)
        uses: actions/upload-artifact@v7
        with:
          name: pvz-android-signing-keystore
          path: ${{ runner.temp }}/pvz-release.keystore
          if-no-files-found: error
          retention-days: 1
