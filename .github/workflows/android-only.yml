name: Android build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

jobs:
  build-android:
    name: Build for Android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: '' # the build needs no extra SDK packages

    - name: Install Android NDK
      run: |
        # Use the latest NDK available on the runner
        if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using pre-installed NDK: $ANDROID_NDK_LATEST_HOME"
        else
          # Fallback: install via sdkmanager
          yes | sdkmanager --install "ndk;$(sdkmanager --list 2>/dev/null | grep -oP 'ndk;\K[\d.]+' | sort -V | tail -1)" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
        fi

    - name: Download SDL2 Source
      run: |
        SDL2_TAG=$(git ls-remote --tags https://github.com/libsdl-org/SDL.git 'refs/tags/release-2.*' \
          | sed 's|.*refs/tags/release-||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$SDL2_TAG" ]; then
          SDL2_TAG="2.32.10" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "Using SDL2 version: $SDL2_TAG"
        wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_TAG}/SDL2-${SDL2_TAG}.tar.gz"
        tar xf "SDL2-${SDL2_TAG}.tar.gz"
        mv "SDL2-${SDL2_TAG}" sdl2-src

    # Key tracks the NDK version (compiler + chainload toolchain are in vcpkg's ABI hash) but not the system CMake version: vcpkg builds ports with its own pinned CMake.
    - name: Get toolchain ID for cache key
      run: |
        NDK_VER=$(grep -oP 'Pkg\.Revision = \K[\d.]+' "$ANDROID_NDK/source.properties" || echo unknown)
        echo "VCPKG_TC=ndk-$NDK_VER" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-android-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-android-${{ env.VCPKG_TC }}-
          vcpkg-android-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build SDL2 Shared Library
      run: |
        # On Android, SDL2 MUST be a shared library because the Java-side
        # SDLActivity loads it via System.loadLibrary("SDL2").
        cmake -B build-sdl2 \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-$ANDROID_API \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=OFF \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2-android \
          -DCMAKE_BUILD_TYPE=Release \
          sdl2-src
        cmake --build build-sdl2 -j$(nproc)
        cmake --install build-sdl2

    - name: Build Native Library with CMake
      run: |
        ABI=arm64-v8a
        BUILD_DIR=build-android-$ABI
        SDL2_PREFIX=$GITHUB_WORKSPACE/sdl2-android

        cmake -B $BUILD_DIR \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-android \
          -DVCPKG_CMAKE_SYSTEM_VERSION=$ANDROID_API \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=$ABI \
          -DANDROID_PLATFORM=android-$ANDROID_API \
          -DSDL2_DIR=$SDL2_PREFIX/lib/cmake/SDL2 \
          -DCMAKE_BUILD_TYPE=Release

        cmake --build $BUILD_DIR -j$(nproc)

        # Collect all shared libraries into jniLibs for Gradle to package
        JNILIBS=android/app/src/main/jniLibs/$ABI
        mkdir -p $JNILIBS
        cp -L $BUILD_DIR/libmain.so $JNILIBS/

        # Copy SDL2 shared library
        cp -L $SDL2_PREFIX/lib/libSDL2*.so $JNILIBS/

        # Copy any .so dependencies from vcpkg (manifest mode installs into build dir)
        VCPKG_LIB=$BUILD_DIR/vcpkg_installed/arm64-android/lib
        for so in "$VCPKG_LIB"/*.so; do
          [ -f "$so" ] && cp -L "$so" $JNILIBS/
        done

        # Strip debug symbols to reduce APK size
        STRIP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
        for so in "$JNILIBS"/*.so; do
          "$STRIP" --strip-unneeded "$so"
        done

        echo "Collected .so files:"
        ls -lh $JNILIBS/

    - name: Report Android signing configuration
      shell: bash
      env:
        PVZP_KEYSTORE_BASE64: ${{ secrets.PVZP_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$PVZP_KEYSTORE_BASE64" ]; then
          echo "A persistent release keystore secret is configured."
        else
          echo "::warning::No persistent release keystore is configured. Gradle will use the runner's debug key; this APK may not update an installation signed by another key."
        fi

    - name: Decode release keystore
      env:
        PVZP_KEYSTORE_BASE64: ${{ secrets.PVZP_KEYSTORE_BASE64 }}
        PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
        PVZP_KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
        PVZP_KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
      run: |
        # Secrets are empty on fork PRs; the build then falls back to debug signing.
        if [ -n "$PVZP_KEYSTORE_BASE64" ] && [ -n "$PVZP_KEYSTORE_PASSWORD" ] && [ -n "$PVZP_KEY_ALIAS" ] && [ -n "$PVZP_KEY_PASSWORD" ]; then
          echo "$PVZP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pvzp-release.keystore"
          echo "PVZP_KEYSTORE_FILE=$RUNNER_TEMP/pvzp-release.keystore" >> "$GITHUB_ENV"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # sdl2-src ships its own wrapper jar, which is not in Gradle's known checksum database
        validate-wrappers: false

    - name: Build APK with Gradle
      env:
        PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
        PVZP_KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
        PVZP_KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Use gradle wrapper; package pre-built native libraries into a release APK
        gradle wrapper
        ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon

    - name: Copy APK
      run: |
        mkdir -p dist
        find android -name "*.apk" -path "*/release/*" -exec cp {} dist/pvz-portable-android-arm64-v8a.apk \;

    - name: Verify APK signature
      shell: bash
      run: |
        APK="dist/pvz-portable-android-arm64-v8a.apk"
        if [ ! -f "$APK" ]; then
          echo "::error::APK not found: $APK"
          exit 1
        fi

        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        if [ -z "$APKSIGNER" ]; then
          echo "::error::apksigner was not found in the Android SDK build-tools."
          exit 1
        fi

        echo "=== APK signature verification ==="
        "$APKSIGNER" verify --verbose --print-certs "$APK"

    - name: Upload Android APK
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-android-arm64-v8a
        path: dist/pvz-portable-android-arm64-v8a.apk
        if-no-files-found: error

