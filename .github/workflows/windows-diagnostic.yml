name: Windows diagnostic build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-diagnostic:
    name: Build PvZ-Portable for Windows (diagnostics)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libopenmpt
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2

      - name: Configure diagnostic build
        shell: msys2 {0}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONSOLE=ON \
            -DPVZ_DEBUG=ON \
            -DBUILD_STATIC=ON \
            -DCMAKE_COLOR_DIAGNOSTICS=ON

      - name: Compile with verbose commands
        shell: msys2 {0}
        run: cmake --build build --verbose

      - name: Prepare diagnostic artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/pvz-portable.exe dist/
          cat > dist/DIAGNOSTICS.txt <<'EOF'
          PvZ-Portable Windows diagnostic build (MSYS2 UCRT64)

          - This executable is built with Debug symbols, CONSOLE=ON and PVZ_DEBUG=ON.
          - Run pvz-portable.exe; keep the console window open while reproducing the issue.
          - The app's debug file log is expected at the configured userdata path, usually:
            %APPDATA%\io.github.wszqkzqk\PvZPortable\userdata\log.txt
          - Send the complete console output and userdata\log.txt.
          - This is a diagnostic build, not the recommended build for normal play.
          EOF

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: pvz-portable-windows-diagnostic-ucrt64
          path: dist/
          if-no-files-found: error
